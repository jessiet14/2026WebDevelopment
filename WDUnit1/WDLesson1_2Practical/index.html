<!DOCTYPE html>
<!-- WD Lesson 1.2: How do we work with images on a web page? -->
<!-- Resources 
      https://www.w3schools.com/html/html_images.asp
      https://www.w3schools.com/tags/tag_img.asp
-->

<html>
  <head>
    <title>Exploring Images</title>
  </head>
  <body>
    <!-- Example of an image from external source
        <img src="https://www.pinclipart.com/picdir/middle/199-1994265_7-duke-java-clipart.png">
    -->

    <!-- Challenge 1: Create an <h1> and put "External Source Images" -->
<h1>External Source Images</h1>
    <!-- Challenge 2: Add an image of your choice by searching Google and getting the image address. -->
<img src="https://gbaike-image.cdn.bcebos.com/0d338744ebf81a4c510f221fef737759252dd52a08e9/0d338744ebf81a4c510f221fef737759252dd52a08e9_1_1?x-bce-process=image/format,f_auto">
    <!-- Challenge 3: Add three more of the same image.  Change the width and height of each image to 
     be 200x200 for the first, 150x150 for the second and 100x100 for the third -->
<img src="https://gbaike-image.cdn.bcebos.com/0d338744ebf81a4c510f221fef737759252dd52a08e9/0d338744ebf81a4c510f221fef737759252dd52a08e9_1_1?x-bce-process=image/format,f_auto" height="200" width="200">
<img src="https://gbaike-image.cdn.bcebos.com/0d338744ebf81a4c510f221fef737759252dd52a08e9/0d338744ebf81a4c510f221fef737759252dd52a08e9_1_1?x-bce-process=image/format,f_auto" height="150" width="150">
<img src="https://gbaike-image.cdn.bcebos.com/0d338744ebf81a4c510f221fef737759252dd52a08e9/0d338744ebf81a4c510f221fef737759252dd52a08e9_1_1?x-bce-process=image/format,f_auto" height="100" width="100">
  <hr>
  <!-- Example of image from internal source, i.e your website 
    <img src="HulkLogo1.png">
  -->
  <!-- Challenge 4: Create an <h1> and put "Internal Source Images" -->
<h1>Internal Source Images</h1>
  <!-- Challenge 5: Add the Hulk Logo 2 image located internally in the folder to the page -->
<img src="HulkLogo2.jpg">
  <hr>
  <!-- Example of image from an internal source stored within folder of your website 
    <img src="images/HulkSmash1.png">
  -->  

  <!-- Challenge 6: Create an <h1> and put "Internal Source Images Inside Folders" -->
<h1>Internal Source Images Inside Folders</h1>
  <!-- Challenge 7: Add the Hulk Smash 2 and Hulk Smash 3 images. 
                   Both images are located in the images folder to the page -->
<img src="images/HulkSmash2.png">
<img src="images/HulkSmash3.jpg">
  <hr>
  <!-- Challenge Bonus: Create a heading with "Marvel Superheroes".  Add a horizontal rule.  
   Add five images of Marvel Superheroes.  Make them all the same size -->
   <h1>Marvel Superheroes</h1>
   <hr>
   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR31FdDjh12w7JHXxnj8UtI9Ozsmc9lGj6-EWL9Z3V_cw&s=10" height="200" width="200">
   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQiOXOTH1mbGfRPISSHOi04lNR5nVAkB_PJm7gCbeqoeg&s=10" height="200" width="200">
   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSx4lHNN7U-e2S4IXZTZnycwTaDk-KpoTkwDYyspsSTrw&s=10" height="200" width="200">
   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcStRkbmRJumaVfEPIhU2NWyg_7S1gn_h4o74_PXAShnLA&s=10" height="200" width="200">
   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTR9gMAVugs77jLDpasyl88UR5F7JsDfmcPnDOurcvinA&s=10" height="200" width="200">
  </body>
</html>
